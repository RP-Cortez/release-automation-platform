name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gates:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pyyaml jsonschema

      - name: Run Ruff (Linter & Formatter)
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy (Static Type Check)
        run: |
          mypy src/

      - name: Run Pytest (Unit Tests)
        run: |
          pytest -v

  container-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t release-platform/validator:ci-test .

      - name: Test Container Execution
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/config:/app/config" \
            release-platform/validator:ci-test \
            --config /app/config/valid_config.yaml \
            --schema /app/schema/app_config_schema.json
